name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IAT_DB_PATH: /tmp/iat-test.sqlite
      IAT_ENABLE_RUNTIME_GOVERNANCE_LOOP: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q iat integrations nodes local_agents malicious_agent examples tests
      - run: python -m ruff check iat integrations nodes local_agents malicious_agent examples tests
      - run: python -m pytest
