services:
  - type: worker
    name: iat-goia-collector-virginia
    runtime: image
    plan: starter
    region: virginia
    numInstances: 1
    maxShutdownDelaySeconds: 60
    image:
      url: docker.io/molamoh/iat-goia-worker:7db1b9c
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: IAT_GOIA_COLLECTION_HOSTS
        sync: false
      - key: IAT_GOIA_COLLECTION_ENABLED
        value: "true"
      - key: IAT_GOIA_WORKER_INTERVAL_SECONDS
        value: "30"
      - key: IAT_GOIA_PUBLIC_DISCOVERY_ENABLED
        value: "true"
      - key: IAT_GOIA_PUBLIC_DISCOVERY_INTERVAL_SECONDS
        value: "900"
      - key: IAT_GOIA_WORKER_ID
        value: render-goia-collector-1
      - key: IAT_GOIA_PARTNERSHIP_DELIVERY_ENABLED
        value: "false"
      - key: IAT_GOIA_PARTNERSHIP_HTTP_ENABLED
        value: "false"
