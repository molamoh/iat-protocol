services:
  - type: pserv
    name: iat-quote-signer-devnet
    runtime: image
    plan: starter
    region: frankfurt
    autoDeploy: false
    image:
      url: docker.io/molamoh/iat-quote-signer:e04f06b
    envVars:
      - key: IAT_QUOTE_SIGNER_ENABLED
        value: "false"
      - key: IAT_QUOTE_SIGNER_CLUSTER
        value: devnet
      - key: IAT_QUOTE_SIGNER_ALLOW_LOCAL_KEYPAIR
        value: "false"
      - key: IAT_QUOTE_SIGNER_SHARED_SECRET
        sync: false
      - key: IAT_QUOTE_SIGNER_KEYPAIR_PATH
        value: /etc/secrets/iat-quote-authority.json
