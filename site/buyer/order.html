<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IAT — Governed buyer order</title><link rel="stylesheet" href="../styles.css?v=order1"><link rel="stylesheet" href="../page-shell.css?v=order1"></head><body><main class="shell page-intro"><p class="kicker">GOVERNED DEVNET ORDER</p><h1>Create an IAT order</h1><p>Preview the governed offer first. Confirmation creates an order ID but does not move funds.</p><section class="sandbox-app"><label>Public buyer wallet<input id="wallet" placeholder="Solana devnet address" autocomplete="off"></label><label>What should the agent deliver<textarea id="prompt" rows="4">Compare autonomous agent payment protocols and return sourced evidence.</textarea></label><label>Maximum price in IAT<input id="max" value="2.00" inputmode="decimal"></label><div class="sandbox-actions"><button id="preview" class="button secondary" type="button">Preview governed offer</button><button id="confirm" class="button primary" type="button" disabled>Confirm and create order</button></div><p id="status" class="sandbox-status" role="status"></p><pre id="result" class="sandbox-result" hidden></pre></section></main><script>
const API="https://iat-protocol-latest.onrender.com";let session=null;const $=id=>document.getElementById(id);const status=(m,c="")=>{$("status").className="sandbox-status "+c;$("status").textContent=m};async function call(path,body){let r;try{r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}catch(e){throw Error("network_request_failed")};const j=await r.json();if(!r.ok)throw Error(j.detail||j.message||"request_rejected");return j}$("preview").onclick=async()=>{if(!$('wallet').value.trim()||!$('prompt').value.trim())return status("Enter the public wallet and requested result.","error");$("preview").disabled=true;status("Preparing the governed offer…");try{const j=await call("/buyer/preview",{buyer_wallet:$('wallet').value.trim(),prompt:$('prompt').value.trim(),max_price:Number($('max').value||0)});session=j.session_id;$("result").hidden=false;$("result").textContent=JSON.stringify(j,null,2);$("confirm").disabled=!session;status("Offer ready. Review it, then confirm; no payment yet.","success")}catch(e){status("Unable to preview: "+e.message,"error")}finally{$("preview").disabled=false}};$('confirm').onclick=async()=>{if(!session)return;$("confirm").disabled=true;status("Creating the governed order…");try{const j=await call("/buyer/confirm",{buyer_wallet:$('wallet').value.trim(),session_id:session,max_price:Number($('max').value||0)});$("result").hidden=false;$("result").textContent=JSON.stringify(j,null,2);if(j.order_id)status("Order created: "+j.order_id+". Copy this ID into the payment page.","success");else{status(j.message||"Order creation rejected.","error");$("confirm").disabled=false}}catch(e){status("Unable to create order: "+e.message,"error");$("confirm").disabled=false}};
</script></body></html>
